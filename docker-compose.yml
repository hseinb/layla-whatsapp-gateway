version: '3.8'

services:
  layla-whatsapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: layla-whatsapp-daemon
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - ./session_auth:/app/session_auth
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
